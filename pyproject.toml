[project]
name = "flight-delays"
version = "0.1.0"
description = "Flight delay analysis and prediction using US BTS On-Time Performance data and aviation weather (METAR/TAF)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]
# Only needed to re-run the scripts under research/.
research = [
    "numpy>=2",
    "pandas>=2.2",
    "pyarrow>=17",
]

[tool.uv]
default-groups = ["dev", "research"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_delays"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["_rescue", "data", "dbt/target", "dbt/dbt_packages", "dbt/logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Research scripts are kept close to the exploratory code that produced the
# documented numbers, so stylistic findings in them are not enforced.
"research/**" = ["B023", "B905", "E402", "E722", "E731", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
